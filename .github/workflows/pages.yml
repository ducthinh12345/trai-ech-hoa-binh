name: Deploy demo tĩnh lên GitHub Pages

# GitHub Pages chỉ phục vụ file tĩnh: workflow dựng site bằng SQLite + dữ liệu mẫu, chạy ở chế độ
# STATIC_DEMO (ẩn giỏ hàng, thanh toán, form, tài khoản), xuất HTML rồi đăng lên Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  STATIC_DEMO: 'true'
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
  SESSION_DRIVER: file
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: log

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài dependency và build asset
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Dựng database mẫu
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch "$DB_DATABASE"
          php artisan migrate --seed --force
          php artisan storage:link

      - name: Xuất HTML tĩnh
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          php artisan site:export --source=http://127.0.0.1:8000 --out=dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
